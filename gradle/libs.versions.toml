[versions]
agp = "9.3.0"
kotlin = "2.0.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.13.0"
composeBom = "2024.09.00"
navigationCompose = "2.9.4"
osmdroidAndroid = "6.1.20"
room = "2.8.5"
ksp = "2.2.10-2.0.2"
cameraX = "1.6.2"
mlKit = "17.3.0"
ubicacionGoogle = "21.4.0"
zXing= "3.5.4"
